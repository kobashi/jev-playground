<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trade Fours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* ---- tokens: light is the base set ---- */
:root{
  --ground:#E8ECF0;
  --surface:#F7F9FB;
  --sunken:#DDE3E9;
  --line:#C6D0D9;
  --line-soft:#D6DEE5;
  --ink:#16222E;
  --ink-2:#53677A;
  --ink-3:#8295A5;
  --you:#0F766E;
  --you-fill:#149188;
  --you-ghost:#BFEDE7;
  --bot:#B4400C;
  --bot-fill:#D9631F;
  --bot-ghost:#FBDCC4;
  --focus:#1D4ED8;
  --shadow:0 1px 2px rgba(16,34,46,.10), 0 6px 18px -12px rgba(16,34,46,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#101720;
    --surface:#18212B;
    --sunken:#0B1118;
    --line:#2A3743;
    --line-soft:#212C37;
    --ink:#E4EDF4;
    --ink-2:#9AAEBF;
    --ink-3:#697E90;
    --you:#3ED9C4;
    --you-fill:#2BBBA8;
    --you-ghost:#123F3A;
    --bot:#FB923C;
    --bot-fill:#E5762A;
    --bot-ghost:#41220C;
    --focus:#7AA2FF;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#101720;
  --surface:#18212B;
  --sunken:#0B1118;
  --line:#2A3743;
  --line-soft:#212C37;
  --ink:#E4EDF4;
  --ink-2:#9AAEBF;
  --ink-3:#697E90;
  --you:#3ED9C4;
  --you-fill:#2BBBA8;
  --you-ghost:#123F3A;
  --bot:#FB923C;
  --bot-fill:#E5762A;
  --bot-ghost:#41220C;
  --focus:#7AA2FF;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.8);
}

html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  height:100%;
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:"Public Sans",system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-text-size-adjust:100%;
}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.app{
  height:100%;
  display:flex;
  flex-direction:column;
  gap:10px;
  padding-block:10px;
  padding-left:16px;
  padding-right:16px;
  max-width:1120px;
  margin:0 auto;
}

/* ---- header ---- */
.bar{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;flex:0 0 auto}
.brand{display:flex;flex-direction:column;gap:1px;margin-right:auto}
.brand h1{
  font-family:"Bricolage Grotesque",system-ui,sans-serif;
  font-weight:800;font-size:23px;line-height:1;letter-spacing:-.02em;margin:0;
}
.brand p{margin:0;font-size:11.5px;color:var(--ink-2)}
.ctrls{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:3px}
.field>span{
  font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--ink-3);font-weight:600;
}
select,input[type="range"]{font:inherit;color:inherit}
select{
  background:var(--surface);border:1px solid var(--line);border-radius:6px;
  padding:5px 8px;font-size:13px;min-width:92px;
}
input[type="range"]{width:108px;accent-color:var(--bot-fill);background:transparent}
.tempo-val{font-family:"DM Mono",ui-monospace,monospace;font-size:13px;font-variant-numeric:tabular-nums}
.toggle{
  display:inline-flex;align-items:center;gap:6px;background:var(--surface);
  border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:13px;cursor:pointer;
}
.toggle input{accent-color:var(--bot-fill);margin:0}
.btn{
  font:inherit;font-size:13px;font-weight:500;cursor:pointer;
  background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:6px;padding:6px 12px;
}
.btn:hover{border-color:var(--ink-3)}
.btn:disabled{opacity:.45;cursor:default}
.btn-accent{background:var(--bot-fill);border-color:var(--bot-fill);color:#fff}
.btn-accent:hover{filter:brightness(1.07)}

/* ---- stage ---- */
.stage{flex:1 1 auto;display:grid;grid-template-columns:minmax(0,1fr) 268px;gap:10px;min-height:0}
@media (max-width:820px){
  .app{height:auto;min-height:100%}
  .stage{grid-template-columns:minmax(0,1fr);grid-auto-rows:auto}
  .roll{min-height:250px}
  .panel{overflow:visible;max-height:none}
  .pads{position:sticky;bottom:0;background:var(--ground);padding-block:7px}
}

.roll-wrap{
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;overflow:hidden;
}
.roll-head{
  display:flex;align-items:center;gap:12px;padding:8px 12px 7px;
  border-bottom:1px solid var(--line-soft);flex:0 0 auto;flex-wrap:wrap;
}
.status{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;margin-right:auto}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:0 0 auto}
.dot.live{background:var(--you-fill);animation:pulse 1.1s ease-in-out infinite}
.dot.resp{background:var(--bot-fill)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.legend{display:flex;gap:12px;font-size:11px;color:var(--ink-2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.legend .k-you{background:var(--you-fill)}
.legend .k-bot{background:var(--bot-fill)}
.seats{
  flex:0 0 auto;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;
  padding:8px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);box-shadow:var(--shadow);
}
.seats .vs{font-family:"DM Mono",ui-monospace,monospace;color:var(--ink-3);padding-bottom:6px}
.meters{
  display:flex;gap:14px;margin:0 0 5px auto;font-size:11px;color:var(--ink-2);
  font-family:"DM Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;
}
.meters b{font-weight:500;color:var(--ink)}
.source{
  margin:9px 0 0;text-align:right;font-family:"DM Mono",ui-monospace,monospace;
  font-size:10.5px;color:var(--ink-3);
}
.banner{
  flex:0 0 auto;margin:0;padding:7px 11px;border-radius:8px;font-size:12px;
  background:var(--bot-ghost);color:var(--ink);
  border:1px solid color-mix(in srgb, var(--bot) 34%, transparent);
}
.banner.stop{font-weight:600}
.prep{
  font-size:10.5px;font-weight:600;color:var(--bot);
  background:var(--bot-ghost);border:1px solid color-mix(in srgb, var(--bot) 32%, transparent);
  border-radius:99px;padding:2px 9px;white-space:nowrap;
}

.ruler{
  display:flex;flex:0 0 auto;height:17px;border-bottom:1px solid var(--line-soft);
  font-family:"DM Mono",ui-monospace,monospace;font-size:9.5px;color:var(--ink-3);
}
.ruler div{border-left:1px solid var(--line-soft);padding-left:4px;line-height:17px}
.ruler div:first-child{border-left:0}

.roll{position:relative;flex:1 1 auto;min-height:200px;background:var(--sunken);overflow:hidden}
.roll .rows,.roll .cols{position:absolute;inset:0;pointer-events:none}
.note{
  position:absolute;border-radius:3px;
  border:1px solid color-mix(in srgb, var(--ink) 22%, transparent);
}
.note.you{background:var(--you-fill)}
.note.bot{background:var(--bot-fill)}
.note.ghost{opacity:.35}
.seam{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--bot);opacity:.55}
.seam span{
  position:absolute;top:3px;left:5px;font-size:9px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--bot);font-weight:600;white-space:nowrap;
}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.5;left:0}
.empty{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--ink-3);font-size:12.5px;text-align:center;padding:16px;
}

/* ---- readout ---- */
.panel{
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--shadow);padding:11px 12px 12px;overflow-y:auto;min-height:0;
}
.panel h2{
  font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);
  font-weight:600;margin:0 0 7px;
}
.panel h2:not(:first-of-type){margin-top:15px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-family:"DM Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;text-align:right}
.prob{display:flex;flex-direction:column;gap:3px}
.prob-row{display:grid;grid-template-columns:86px 1fr 34px;gap:7px;align-items:center;font-size:11.5px}
.prob-row b{font-weight:500;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prob-row.pick b{color:var(--bot);font-weight:600}
.meter{height:7px;border-radius:3px;background:var(--sunken);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink-3);border-radius:3px}
.prob-row.pick .meter i{background:var(--bot-fill)}
.prob-row em{
  font-family:"DM Mono",ui-monospace,monospace;font-style:normal;font-size:10.5px;
  color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums;
}
.seam-note{
  margin-top:14px;padding:8px 9px;border-radius:7px;
  background:var(--bot-ghost);border:1px solid color-mix(in srgb, var(--bot) 30%, transparent);
  font-size:11px;line-height:1.5;color:var(--ink);
}
.seam-note b{color:var(--bot);font-weight:600}
.seam-note code{
  font-family:"DM Mono",ui-monospace,monospace;font-size:10.5px;
  background:color-mix(in srgb, var(--ink) 9%, transparent);padding:0 3px;border-radius:3px;
}

/* ---- pads ---- */
.pads{flex:0 0 auto;display:flex;flex-direction:column;gap:6px}
.pad-row{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
.pad{
  position:relative;font:inherit;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-radius:7px;
  padding:11px 0 7px;text-align:center;color:var(--ink);
  touch-action:none;user-select:none;-webkit-user-select:none;
}
.pad:hover{border-color:var(--you)}
.pad.on{background:var(--you-ghost);border-color:var(--you-fill)}
.pad b{display:block;font-family:"DM Mono",ui-monospace,monospace;font-size:15px;font-weight:500;line-height:1}
.pad span{display:block;font-size:9px;letter-spacing:.09em;color:var(--ink-3);margin-top:3px}
.hint{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink-3)}
.hint kbd{
  font-family:"DM Mono",ui-monospace,monospace;font-size:10.5px;
  border:1px solid var(--line);border-radius:3px;padding:0 4px;background:var(--surface);
}
.midi-tag{color:var(--you);font-weight:600}
</style>
</head>
<body>
<div class="app">

  <header class="bar">
    <div class="brand">
      <h1>Trade Fours</h1>
      <p>フレーズを弾くと、続きが返ってきます</p>
    </div>
    <div class="ctrls">
      <label class="field"><span>キー</span>
        <select id="tonic"></select>
      </label>
      <label class="field"><span>スケール</span>
        <select id="scale"></select>
      </label>
      <label class="field"><span>テンポ <span class="tempo-val" id="bpm-val">100</span></span>
        <input type="range" id="bpm" min="60" max="160" step="2" value="100">
      </label>
      <label class="toggle" for="metro">
        <input type="checkbox" id="metro"> クリック
      </label>
      <button class="btn" id="replay" type="button">もう一度鳴らす</button>
      <button class="btn btn-accent" id="clear" type="button">最初から</button>
    </div>
  </header>

  <div class="seats">
    <label class="field"><span>一人目</span><select id="seat0"></select></label>
    <span class="vs">↔</span>
    <label class="field"><span>二人目</span><select id="seat1"></select></label>
    <button class="btn" id="auto" type="button">自動セッション開始</button>
    <p class="meters">
      <span>交代 <b id="m-turns">0</b>/<b id="m-max">16</b></span>
      <span>エンジン呼び出し <b id="m-calls">0</b></span>
    </p>
  </div>
  <p class="banner" id="banner" hidden></p>

  <main class="stage">

    <section class="roll-wrap" aria-label="ピアノロール">
      <div class="roll-head">
        <p class="status"><span class="dot" id="dot"></span><span id="status-text">パッドを押すか A〜L キーで弾いてください</span></p>
        <span class="prep" id="prep" hidden></span>
        <p class="legend">
          <span><i class="k-you"></i><span id="lg0">一人目</span></span>
          <span><i class="k-bot"></i><span id="lg1">二人目</span></span>
        </p>
      </div>
      <div class="ruler" id="ruler"></div>
      <div class="roll" id="roll">
        <div class="rows" id="rows"></div>
        <div class="cols" id="cols"></div>
        <div class="playhead" id="playhead" hidden></div>
      </div>
    </section>

    <aside class="panel" aria-label="判断の内訳">
      <h2>解釈</h2>
      <dl class="kv" id="interp">
        <dt>音数</dt><dd>—</dd>
        <dt>長さ</dt><dd>—</dd>
        <dt>密度</dt><dd>—</dd>
        <dt>音域</dt><dd>—</dd>
        <dt>輪郭</dt><dd>—</dd>
        <dt>終止</dt><dd>—</dd>
      </dl>

      <h2>応答戦略</h2>
      <div class="prob" id="strategies"></div>

      <h2>候補ランキング</h2>
      <div class="prob" id="candidates"></div>

      <p class="source" id="source" hidden></p>

      <div class="seam-note">
        <b>席ごとにエンジンを選べます。</b>
        ローカルはヒューリスティック、Jev は候補一式を <code>/api/respond</code> に送って
        選ばせます。どちらも同じ確率分布を返すので、選び方も表示も共通です。
      </div>
    </aside>

  </main>

  <footer class="pads">
    <div class="pad-row" id="pads"></div>
    <p class="hint">
      <span><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><kbd>F</kbd><kbd>G</kbd><kbd>H</kbd><kbd>J</kbd><kbd>K</kbd><kbd>L</kbd> で演奏</span>
      <span>弾き終えて少し待つと応答します</span>
      <span id="midi-status"></span>
    </p>
  </footer>

</div>
<script>
(() => {
"use strict";

// ---------------------------------------------------------------------------
// Musical constants
// ---------------------------------------------------------------------------

const TONICS = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

const SCALES = {
  major:      { label:"メジャー",       steps:[0,2,4,5,7,9,11] },
  minor:      { label:"マイナー",       steps:[0,2,3,5,7,8,10] },
  dorian:     { label:"ドリアン",       steps:[0,2,3,5,7,9,10] },
  mixolydian: { label:"ミクソリディアン", steps:[0,2,4,5,7,9,10] },
  pentatonic: { label:"ペンタトニック",   steps:[0,2,4,7,9] },
  blues:      { label:"ブルース",       steps:[0,3,5,6,7,10] },
};

const STRATEGIES = {
  imitate:  "模倣",
  sequence: "移高反復",
  invert:   "反行",
  extend:   "引き伸ばし",
  contrast: "対比",
  sparse:   "間で受ける",
  question: "問い返し",
};

const KEYS = ["a","s","d","f","g","h","j","k","l"];
const DEG_MAX = 10, DEG_MIN = -2, ROWS = DEG_MAX - DEG_MIN + 1;
const GRID = 0.5;              // quantization grid, in quarter-note beats
const CAND_COUNT = 8;

const $ = (sel) => document.querySelector(sel);
const mod = (n, m) => ((n % m) + m) % m;
const clampDeg = (d) => Math.max(DEG_MIN, Math.min(DEG_MAX, Math.round(d)));
const scaleLen = () => SCALES[state.scale].steps.length;
const phraseLen = (ns) => ns.length ? ns[ns.length - 1].beat + ns[ns.length - 1].dur : 0;
const shiftToZero = (ns) => {
  if (!ns.length) return [];
  const off = ns[0].beat;
  return ns.map((n) => ({ degree: n.degree, beat: +(n.beat - off).toFixed(3), dur: n.dur }));
};

const state = {
  tonic: "C",
  scale: "major",
  bpm: 100,
  metro: false,
  phase: "idle",
  call: [],
  response: [],
  respStart: 4,
  totalBeats: 8,
  readout: null,
  callAnchor: null,
  callSeat: 0,
  respSeat: 1,
  isExample: true,
};

// ---------------------------------------------------------------------------
// Audio
// ---------------------------------------------------------------------------

let ctx = null;

function audio() {
  if (!ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
  }
  if (ctx.state === "suspended") ctx.resume();
  return ctx;
}

const midiToHz = (m) => 440 * Math.pow(2, (m - 69) / 12);

function degToMidi(d) {
  const steps = SCALES[state.scale].steps;
  const len = steps.length;
  return 60 + TONICS.indexOf(state.tonic) + Math.floor(d / len) * 12 + steps[mod(d, len)];
}

function buildVoice(c, midi, kind) {
  const osc = c.createOscillator();
  const filt = c.createBiquadFilter();
  const gain = c.createGain();
  osc.type = kind === "bot" ? "sawtooth" : "triangle";
  osc.frequency.value = midiToHz(midi);
  filt.type = "lowpass";
  filt.frequency.value = kind === "bot" ? 1700 : 2700;
  filt.Q.value = 0.8;
  gain.gain.value = 0;
  osc.connect(filt); filt.connect(gain); gain.connect(c.destination);
  return { osc, gain };
}

/** Schedule one note with a fixed duration. */
function playNote(midi, when, dur, kind) {
  const c = audio();
  if (!c) return;
  const { osc, gain } = buildVoice(c, midi, kind);
  const peak = kind === "bot" ? 0.15 : 0.19;
  const attack = 0.01;
  gain.gain.setValueAtTime(0.0001, when);
  gain.gain.linearRampToValueAtTime(peak, when + attack);
  gain.gain.setTargetAtTime(0.0001, when + Math.max(attack + 0.02, dur * 0.85), 0.055);
  osc.start(when);
  osc.stop(when + dur + 0.4);
}

/** Start a note that rings until stop() — used while a key is held. */
function startVoice(midi, kind) {
  const c = audio();
  if (!c) return { stop() {} };
  const { osc, gain } = buildVoice(c, midi, kind);
  const t = c.currentTime;
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.linearRampToValueAtTime(0.19, t + 0.01);
  osc.start(t);
  let stopped = false;
  return {
    stop() {
      if (stopped) return;
      stopped = true;
      const now = c.currentTime;
      gain.gain.cancelScheduledValues(now);
      gain.gain.setValueAtTime(Math.max(gain.gain.value, 0.0001), now);
      gain.gain.linearRampToValueAtTime(0.0001, now + 0.09);
      osc.stop(now + 0.12);
    },
  };
}

function playClick(when, accent) {
  const c = audio();
  if (!c) return;
  const osc = c.createOscillator();
  const gain = c.createGain();
  osc.type = "square";
  osc.frequency.value = accent ? 1560 : 1040;
  gain.gain.setValueAtTime(0.0001, when);
  gain.gain.exponentialRampToValueAtTime(accent ? 0.1 : 0.05, when + 0.002);
  gain.gain.exponentialRampToValueAtTime(0.0001, when + 0.045);
  osc.connect(gain); gain.connect(c.destination);
  osc.start(when);
  osc.stop(when + 0.08);
}

// ---------------------------------------------------------------------------
// Transport — one clock for the whole session, so the answer lands in time
// ---------------------------------------------------------------------------

let transport = null;
let nextClick = 0;

function startTransport() {
  const c = audio();
  if (!c) return;
  transport = { t0: c.currentTime, bpm: state.bpm };
  nextClick = 0;
}

function beatNow() {
  if (!ctx || !transport) return 0;
  return (ctx.currentTime - transport.t0) * transport.bpm / 60;
}

function beatToTime(b) {
  return transport.t0 + b * 60 / transport.bpm;
}

/** Change tempo without moving the beat the player is currently on. */
function setBpm(bpm) {
  if (transport && ctx) {
    const b = beatNow();
    transport.t0 = ctx.currentTime - b * 60 / bpm;
    transport.bpm = bpm;
    nextClick = Math.ceil(beatNow());
  }
  state.bpm = bpm;
}

// ---------------------------------------------------------------------------
// Capture — onsets are transport beats, so player and answer share one grid
// ---------------------------------------------------------------------------

const held = new Map();
let events = [];
let lastActivity = 0;

const snap = (b) => Math.round(b / GRID) * GRID;

/** Released notes plus the ones still down, so speculation sees the live phrase. */
function currentEvents() {
  const now = beatNow();
  const live = [...held.entries()].map(([degree, h]) => ({
    degree,
    beatOn: h.beatOn,
    beatOff: Math.max(now, h.beatOn + GRID / 2),
  }));
  return [...events, ...live].sort((a, b) => a.beatOn - b.beatOn);
}

/** Quantize the turn so far, and report which beat it starts on. */
function quantizeTurn() {
  const raw = currentEvents();
  if (!raw.length) return { anchor: 0, notes: [] };
  const anchor = snap(raw[0].beatOn);
  const slots = new Map();
  for (const e of raw) {
    const degree = clampDeg(e.degree);
    const beat = Math.max(0, snap(e.beatOn) - anchor);
    const dur = Math.max(GRID, snap(e.beatOff - e.beatOn));
    const key = beat + ":" + degree;
    const prev = slots.get(key);
    if (!prev || dur > prev.dur) slots.set(key, { degree, beat, dur });
  }
  return {
    anchor,
    notes: [...slots.values()].sort((a, b) => a.beat - b.beat || a.degree - b.degree),
  };
}

// ---------------------------------------------------------------------------
// Jev seam #1 — interpretation. Replace the body with one systemOne() call.
// ---------------------------------------------------------------------------

function interpret(call) {
  const len = phraseLen(call);
  const bars = Math.max(1, Math.ceil(len / 4));
  const degs = call.map((n) => n.degree);
  const lo = degs.length ? Math.min(...degs) : 0;
  const hi = degs.length ? Math.max(...degs) : 0;
  const first = degs.length ? degs[0] : 0;
  const last = degs.length ? degs[degs.length - 1] : 0;
  return {
    count: call.length,
    len,
    bars,
    range: hi - lo,
    density: call.length / bars,
    dir: last > first + 0.5 ? "rising" : last < first - 0.5 ? "falling" : "level",
    closed: mod(last, scaleLen()) === 0,
    lastDeg: last,
  };
}

// ---------------------------------------------------------------------------
// Jev seam #2 — strategy. Replace with a choice() question over STRATEGIES.
// ---------------------------------------------------------------------------

function chooseStrategy(itp) {
  const w = { imitate:1, sequence:1, invert:.8, extend:1, contrast:.8, sparse:.6, question:.8 };
  if (itp.density > 5) { w.sparse *= 3; w.contrast *= 1.5; w.imitate *= .5; }
  if (itp.density < 2) { w.extend *= 2; w.sequence *= 1.5; w.sparse *= .3; }
  if (itp.closed) { w.contrast *= 1.6; w.question *= 1.4; w.imitate *= .7; }
  else { w.extend *= 1.8; w.imitate *= 1.3; w.question *= .6; }
  if (itp.range > 6) w.invert *= 1.6;
  if (itp.count < 3) { w.sparse *= .4; w.extend *= 1.4; }

  const keys = Object.keys(w);
  const total = keys.reduce((s, k) => s + w[k], 0);
  const probs = {};
  for (const k of keys) probs[k] = w[k] / total;
  return { pick: sampleKey(probs), probs };
}

// ---------------------------------------------------------------------------
// Candidate generation — stays local. Jev selects, it does not generate.
// ---------------------------------------------------------------------------

function nearestChordTone(d) {
  const len = scaleLen();
  for (let off = 0; off <= 7; off++) {
    for (const cand of [d - off, d + off]) {
      const m = mod(cand, len);
      if (m === 0 || m === 2 || m === 4) return clampDeg(cand);
    }
  }
  return clampDeg(d);
}

const GENERATORS = {
  imitate(call, itp, i) {
    const out = shiftToZero(call).map((n) => ({ ...n }));
    if (!out.length) return out;
    if (i % 2 === 1) out[out.length - 1].degree = nearestChordTone(out[out.length - 1].degree);
    if (i >= 4 && out.length > 1) {
      const k = 1 + (i % (out.length - 1));
      out[k].degree = clampDeg(out[k].degree + (i % 2 ? 1 : -1));
    }
    return out;
  },

  sequence(call, itp, i) {
    const shift = [2, -2, 3, -3, 1, -1, 4, -4][i % 8];
    return shiftToZero(call).map((n) => ({ ...n, degree: clampDeg(n.degree + shift) }));
  },

  invert(call, itp, i) {
    const src = shiftToZero(call);
    if (!src.length) return src;
    const pivot = src[0].degree + (i % 3) - 1;
    return src.map((n) => ({ ...n, degree: clampDeg(2 * pivot - n.degree) }));
  },

  extend(call, itp, i) {
    const src = shiftToZero(call);
    if (!src.length) return src;
    const keep = Math.max(1, Math.ceil(src.length / 2));
    const out = shiftToZero(src.slice(-keep)).map((n) => ({ ...n }));
    const step = itp.dir === "falling" ? -1 : 1;
    let d = out[out.length - 1].degree;
    let b = phraseLen(out);
    const add = 2 + (i % 3);
    for (let j = 0; j < add; j++) {
      d = clampDeg(d + step * (1 + (j % 2)));
      const last = j === add - 1;
      if (last) d = nearestChordTone(d);
      const dur = last ? 1.5 : 0.5;
      out.push({ degree: d, beat: b, dur });
      b += dur;
    }
    return out;
  },

  contrast(call, itp, i) {
    const step = itp.dir === "rising" ? -1 : 1;
    const rhythm = i % 2 ? [1, .5, .5, 1, 1.5] : [.5, 1.5, .5, 1, .5];
    const n = 3 + (i % 3);
    let d = clampDeg(itp.lastDeg + step * 3);
    let b = 0;
    const out = [];
    for (let j = 0; j < n; j++) {
      const dur = rhythm[j % rhythm.length];
      out.push({ degree: j === n - 1 ? nearestChordTone(d) : d, beat: b, dur });
      b += dur;
      d = clampDeg(d + step * (j % 2 ? 2 : 1));
    }
    return out;
  },

  sparse(call, itp, i) {
    const pool = call.length ? call.map((n) => n.degree) : [0];
    const n = 2 + (i % 2);
    const out = [];
    let b = 0;
    for (let j = 0; j < n; j++) {
      const d = pool[(i + j * 2) % pool.length];
      const last = j === n - 1;
      const dur = last ? 2 : 1.5;
      out.push({ degree: last ? nearestChordTone(d) : clampDeg(d), beat: b, dur });
      b += dur + 0.5;
    }
    return out;
  },

  question(call, itp, i) {
    const src = shiftToZero(call);
    const take = Math.max(1, Math.min(src.length, 3 + (i % 2)));
    const out = src.slice(0, take).map((n) => ({ ...n }));
    const b = phraseLen(out);
    const target = i % 2 ? 4 : 6;
    out.push({ degree: clampDeg(target), beat: b, dur: 1.5 });
    return out;
  },
};

function generate(strategy, call, itp, n) {
  const gen = GENERATORS[strategy];
  const out = [];
  const seen = new Set();
  for (let i = 0; i < n * 2 && out.length < n; i++) {
    const cand = gen(call, itp, i).filter((x) => Number.isFinite(x.degree));
    if (!cand.length) continue;
    const sig = cand.map((x) => x.degree + "@" + x.beat + "/" + x.dur).join(",");
    if (seen.has(sig)) continue;
    seen.add(sig);
    out.push(cand);
  }
  return out;
}

// ---------------------------------------------------------------------------
// Jev seam #3 — ranking. Replace with a choice() whose criteria ARE the
// candidates, then sample from the returned probabilities instead of argmax.
// ---------------------------------------------------------------------------

function rank(cands, call, itp, strategy) {
  const len = scaleLen();
  const callSig = call.map((n) => n.degree).join(",");
  return cands.map((c) => {
    if (!c.length) return 0.01;
    let s = 0.5;
    let leaps = 0, steps = 0;
    for (let i = 1; i < c.length; i++) {
      const iv = Math.abs(c[i].degree - c[i - 1].degree);
      if (iv > 3) leaps++; else if (iv <= 2) steps++;
    }
    s -= leaps * 0.07;
    s += Math.min(0.12, steps * 0.03);
    const lastM = mod(c[c.length - 1].degree, len);
    if (lastM === 0) s += 0.18;
    else if (lastM === 2 || lastM === 4) s += 0.09;
    else s -= 0.05;
    s -= Math.min(0.22, Math.abs(phraseLen(c) - itp.len) * 0.055);
    if (c.length < 2) s -= 0.15;
    if (strategy !== "imitate" && c.map((n) => n.degree).join(",") === callSig) s -= 0.25;
    const degs = c.map((n) => n.degree);
    const rng = Math.max(...degs) - Math.min(...degs);
    if (rng === 0) s -= 0.12;
    if (rng > 9) s -= 0.1;
    return Math.min(0.99, Math.max(0.01, s));
  });
}

// ---------------------------------------------------------------------------
// Sampling — the same shape Jev's probabilities will slot into
// ---------------------------------------------------------------------------

function softmax(scores, temp) {
  const max = Math.max(...scores);
  const ex = scores.map((s) => Math.exp((s - max) / temp));
  const sum = ex.reduce((a, b) => a + b, 0);
  return ex.map((e) => e / sum);
}

function sampleKey(probs) {
  let r = Math.random();
  const keys = Object.keys(probs);
  for (const k of keys) { r -= probs[k]; if (r <= 0) return k; }
  return keys[keys.length - 1];
}

function sampleIndex(probs) {
  let r = Math.random();
  for (let i = 0; i < probs.length; i++) { r -= probs[i]; if (r <= 0) return i; }
  return probs.length - 1;
}

/** Run the whole decision pipeline over one call phrase. */
function respond(call) {
  const itp = interpret(call);
  const strat = chooseStrategy(itp);
  const cands = generate(strat.pick, call, itp, CAND_COUNT);
  const scores = rank(cands, call, itp, strat.pick);
  const probs = softmax(scores, 0.12);
  const idx = sampleIndex(probs);
  return { itp, strat, cands, probs, idx, response: cands[idx] || [] };
}

// ---------------------------------------------------------------------------
// Engines — local heuristics, or Jev behind the one endpoint that holds a key
// ---------------------------------------------------------------------------

const SEATS = {
  human: "あなた",
  local: "ローカル",
  jev: "Jev",
};

const JEV_ENDPOINT = "/api/respond";
const JEV_TIMEOUT_MS = 5000;
const JEV_POOL_PER_STRATEGY = 2;
const JEV_POOL_MAX = 20;

let engineCalls = 0;

/** Build a pool that spans every strategy. Jev ranks it; it never writes notes. */
function candidatePool(call, itp) {
  const pool = [];
  for (const strategy of Object.keys(STRATEGIES)) {
    for (const notes of generate(strategy, call, itp, JEV_POOL_PER_STRATEGY)) {
      if (pool.length >= JEV_POOL_MAX) break;
      pool.push({ id: "c" + pool.length, strategy, notes });
    }
  }
  return pool;
}

/**
 * Turn Jev's answers into the same result shape the local pipeline returns, so
 * everything downstream — sampling, the readout, the guards — is untouched.
 */
function fromJev(pool, data, itp) {
  const answers = (data && data.answers) || {};
  const cands = pool.map((c) => c.notes);
  const table = answers.best && answers.best.probabilities;
  const raw = pool.map((c) => (table && typeof table[c.id] === "number" ? Math.max(0, table[c.id]) : 0));
  const total = raw.reduce((a, b) => a + b, 0);
  const probs = total > 0 ? raw.map((p) => p / total) : cands.map(() => 1 / cands.length);
  const idx = sampleIndex(probs);

  // a strategy is worth the probability mass its candidates carry
  const stratProbs = {};
  for (const k of Object.keys(STRATEGIES)) stratProbs[k] = 0;
  pool.forEach((c, i) => { stratProbs[c.strategy] += probs[i]; });

  const ended = answers.ended && typeof answers.ended.noul === "number"
    ? answers.ended.noul >= 0.5
    : itp.closed;

  return {
    itp: Object.assign({}, itp, { closed: ended }),
    strat: { pick: pool[idx].strategy, probs: stratProbs },
    cands,
    probs,
    idx,
    response: cands[idx],
    source: "jev",
    usage: data && data.usage,
    broken: answers.all_broken && typeof answers.all_broken.noul === "number" ? answers.all_broken.noul : null,
  };
}

async function jevRespond(call, signal) {
  const itp = interpret(call);
  const pool = candidatePool(call, itp);
  if (!pool.length) throw new Error("候補を生成できませんでした");

  const ac = new AbortController();
  const timer = setTimeout(() => ac.abort(), JEV_TIMEOUT_MS);
  if (signal) signal.addEventListener("abort", () => ac.abort(), { once: true });

  const startedAt = performance.now();
  try {
    const res = await fetch(JEV_ENDPOINT, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ call, candidates: pool, tonic: state.tonic, scale: state.scale }),
      signal: ac.signal,
    });
    if (!res.ok) {
      let detail = "";
      try { detail = (await res.json()).error || ""; } catch (e) { /* body was not JSON */ }
      throw new Error("HTTP " + res.status + (detail ? " — " + detail : ""));
    }
    const out = fromJev(pool, await res.json(), itp);
    out.latency = Math.round(performance.now() - startedAt);
    return out;
  } finally {
    clearTimeout(timer);
  }
}

/** One call to whichever engine a seat is set to. Counted, for the cost guard. */
async function runEngine(engine, call, signal) {
  engineCalls++;
  updateMeters();
  if (engine === "jev") return await jevRespond(call, signal);
  return Object.assign(respond(call), { source: "local" });
}

// ---------------------------------------------------------------------------
// Session — two seats trade, and either seat may be a person or an engine
// ---------------------------------------------------------------------------

const GUARD = {
  maxTurns: 16,          // an automatic session is never open-ended
  maxEngineCalls: 48,    // and never unbounded in cost
  cycleWindow: 6,        // a phrase seen this recently counts as a repeat
  maxCycleBreaks: 3,     // three rescues, then the session has stalled
  maxErrors: 3,
  maxSpeculationsPerTurn: 6,
};

const session = {
  seats: ["human", "local"],
  active: 0,
  last: [],
  lastAnchor: 0,
  history: [],
  turns: 0,
  breaks: 0,
  errors: 0,
  auto: false,
};

const signature = (notes) => notes.map((n) => n.degree + "@" + n.beat + "/" + n.dur).join(",");
const seatLabel = (i) => SEATS[session.seats[i]];

/**
 * Hard stops for an automatic session, checked before a turn is spent.
 * Returns the reason to stop, or null to carry on.
 */
function guardBeforeTurn(s, calls, hidden) {
  if (s.turns >= GUARD.maxTurns) return "交代が上限（" + GUARD.maxTurns + "回）に達しました";
  if (calls >= GUARD.maxEngineCalls) return "エンジン呼び出しが上限（" + GUARD.maxEngineCalls + "回）に達しました";
  if (s.errors >= GUARD.maxErrors) return "エンジンが連続で失敗しました";
  if (hidden) return "タブが非表示になったため停止しました";
  return null;
}

/**
 * Keep the session from settling into a loop: if the sampled answer repeats a
 * phrase from the recent past, walk down the probabilities for one that does
 * not. `idx` is -1 when every candidate is a repeat.
 */
function resolvePhrase(r, history) {
  const recent = history.slice(-GUARD.cycleWindow);
  const first = signature(r.cands[r.idx] || []);
  if (!recent.includes(first)) return { idx: r.idx, cycled: false };

  const order = r.probs
    .map((p, i) => ({ p, i }))
    .sort((a, b) => b.p - a.p);
  for (const o of order) {
    if (!recent.includes(signature(r.cands[o.i] || []))) return { idx: o.i, cycled: true };
  }
  return { idx: -1, cycled: true };
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------

const pct = (v) => v.toFixed(4) + "%";
const seatClass = (i) => (i === 0 ? "you" : "bot");

function layout() {
  const callLen = phraseLen(state.call);
  if (!state.response.length) {
    state.respStart = Math.max(4, Math.ceil((callLen + 0.5) / 4) * 4);
  }
  const end = Math.max(callLen, state.respStart + phraseLen(state.response));
  state.totalBeats = Math.max(8, Math.ceil(end / 4) * 4);
}

function renderGrid() {
  const rows = $("#rows"), cols = $("#cols"), ruler = $("#ruler");
  const total = state.totalBeats;
  const len = scaleLen();

  rows.innerHTML = "";
  for (let r = 0; r < ROWS; r++) {
    const deg = DEG_MAX - r;
    const el = document.createElement("div");
    el.style.cssText =
      "position:absolute;left:0;right:0;top:" + pct(r * 100 / ROWS) +
      ";height:" + pct(100 / ROWS) + ";border-bottom:1px solid var(--line-soft);" +
      (mod(deg, len) === 0 ? "background:color-mix(in srgb, var(--ink) 5%, transparent);" : "");
    rows.appendChild(el);
  }

  cols.innerHTML = "";
  for (let b = 0; b <= total; b++) {
    const bar = b % 4 === 0;
    const el = document.createElement("div");
    el.style.cssText =
      "position:absolute;top:0;bottom:0;left:" + pct(b * 100 / total) +
      ";width:0;border-left:1px " + (bar ? "solid" : "dotted") + " var(--line);" +
      "opacity:" + (bar ? ".85" : ".4") + ";";
    cols.appendChild(el);
  }

  ruler.innerHTML = "";
  for (let bar = 0; bar < total / 4; bar++) {
    const el = document.createElement("div");
    el.style.width = pct(400 / total);
    el.textContent = String(bar + 1);
    ruler.appendChild(el);
  }
}

function noteEl(n, kind, offset) {
  const total = state.totalBeats;
  const el = document.createElement("div");
  el.className = "note " + kind;
  const row = DEG_MAX - clampDeg(n.degree);
  el.style.left = pct((n.beat + offset) * 100 / total);
  el.style.width = pct(Math.max(n.dur, GRID) * 100 / total - 0.35);
  el.style.top = pct(row * 100 / ROWS + 0.9);
  el.style.height = pct(100 / ROWS - 2.4);
  return el;
}

function renderNotes() {
  const roll = $("#roll");
  roll.querySelectorAll(".note,.seam,.empty").forEach((e) => e.remove());
  const ph = $("#playhead");

  if (!state.call.length && !state.response.length) {
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = session.seats.includes("human")
      ? "パッドを押すと、ここにあなたのフレーズが描かれます"
      : "「自動セッション開始」で二つのエンジンが掛け合いを始めます";
    roll.insertBefore(empty, ph);
    return;
  }

  for (const n of state.call) roll.insertBefore(noteEl(n, seatClass(state.callSeat), 0), ph);

  if (state.response.length) {
    const seam = document.createElement("div");
    seam.className = "seam";
    seam.style.left = pct(state.respStart * 100 / state.totalBeats);
    const tag = document.createElement("span");
    tag.textContent = seatLabel(state.respSeat);
    seam.appendChild(tag);
    roll.insertBefore(seam, ph);
    for (const n of state.response) {
      roll.insertBefore(noteEl(n, seatClass(state.respSeat), state.respStart), ph);
    }
  }
}

function meterRow(label, p, picked) {
  const row = document.createElement("div");
  row.className = "prob-row" + (picked ? " pick" : "");
  const b = document.createElement("b");
  b.textContent = label;
  const meter = document.createElement("div");
  meter.className = "meter";
  const fill = document.createElement("i");
  fill.style.width = pct(Math.max(0, Math.min(1, p)) * 100);
  meter.appendChild(fill);
  const em = document.createElement("em");
  em.textContent = (p * 100).toFixed(0) + "%";
  row.append(b, meter, em);
  return row;
}

function renderReadout() {
  const r = state.readout;
  const dl = $("#interp"), st = $("#strategies"), cd = $("#candidates"), src = $("#source");

  if (!r) {
    dl.querySelectorAll("dd").forEach((d) => { d.textContent = "—"; });
    st.innerHTML = ""; cd.innerHTML = ""; src.hidden = true;
    return;
  }

  const { itp, strat, cands, probs, idx } = r;
  const vals = [
    String(itp.count),
    itp.len.toFixed(1) + " 拍",
    itp.density.toFixed(1) + " /小節",
    String(itp.range),
    { rising: "上行", falling: "下行", level: "横ばい" }[itp.dir],
    itp.closed ? "着地" : "開いたまま",
  ];
  dl.querySelectorAll("dd").forEach((d, i) => { d.textContent = vals[i]; });

  st.innerHTML = "";
  Object.entries(strat.probs)
    .sort((a, b) => b[1] - a[1])
    .forEach(([k, p]) => st.appendChild(meterRow(STRATEGIES[k], p, k === strat.pick)));

  cd.innerHTML = "";
  probs
    .map((p, i) => ({ p, i }))
    .sort((a, b) => b.p - a.p)
    .slice(0, 5)
    .forEach(({ p, i }) => cd.appendChild(meterRow("候補 " + (i + 1) + " · " + cands[i].length + "音", p, i === idx)));

  const bits = [r.source === "jev" ? "Jev" : "ローカル"];
  if (r.latency) bits.push(r.latency + "ms");
  if (r.usage && r.usage.input_tokens) bits.push(r.usage.input_tokens + " tok");
  if (r.broken !== null && r.broken !== undefined) bits.push("破綻 " + (r.broken * 100).toFixed(0) + "%");
  if (r.fellBack) bits.push("Jev 失敗のため代替");
  src.hidden = false;
  src.textContent = bits.join(" · ");
}

function renderPrep() {
  const el = $("#prep");
  if (prepared && prepared.response && prepared.response.length) {
    el.hidden = false;
    el.textContent = "用意済み · " + STRATEGIES[prepared.strat.pick] + " · " + prepared.response.length + "音";
  } else {
    el.hidden = true;
  }
}

function updateMeters() {
  $("#m-turns").textContent = String(session.turns);
  $("#m-calls").textContent = String(engineCalls);
  $("#lg0").textContent = "一人目: " + seatLabel(0);
  $("#lg1").textContent = "二人目: " + seatLabel(1);
}

let bannerTimer = 0;
function showBanner(text, sticky) {
  const el = $("#banner");
  el.hidden = false;
  el.textContent = text;
  el.className = "banner" + (sticky ? " stop" : "");
  clearTimeout(bannerTimer);
  if (!sticky) bannerTimer = setTimeout(() => { el.hidden = true; }, 6000);
}
function clearBanner() {
  clearTimeout(bannerTimer);
  $("#banner").hidden = true;
}

function setStatus(text, mode) {
  $("#status-text").textContent = text;
  $("#dot").className = "dot" + (mode ? " " + mode : "");
}

function renderAll() {
  layout();
  renderGrid();
  renderNotes();
  renderReadout();
}

// ---------------------------------------------------------------------------
// Speculation — the answer is built before its turn arrives, never during it
// ---------------------------------------------------------------------------

let prepared = null;
let prepGen = 0;
let prepTimer = 0;
let specAbort = null;
let specCount = 0;
let lastSpecSig = "";

const SPEC_DELAY = { local: 35, jev: 220 };

/**
 * Ask a seat's engine for its answer to `call` and hold it until its turn.
 * A Jev failure falls back to the local pipeline for that turn rather than
 * dropping the beat, and is counted towards the error guard.
 */
async function prepareAnswer(seat, call, opts) {
  const engine = session.seats[seat];
  if (engine === "human" || !call.length) return null;

  const generation = ++prepGen;
  if (specAbort) specAbort.abort();
  const ac = new AbortController();
  specAbort = ac;

  let r;
  try {
    r = await runEngine(engine, call, ac.signal);
    session.errors = 0;
  } catch (err) {
    if (ac.signal.aborted) return null;
    session.errors++;
    const message = err && err.message ? err.message : String(err);
    showBanner("Jev 呼び出しに失敗 — このターンはローカルで代替します: " + message);
    r = Object.assign(respond(call), { source: "local", fellBack: true });
  }
  if (generation !== prepGen) return null;      // a newer phrase arrived; this is stale

  prepared = Object.assign({ forSeat: seat, call }, r);
  if (opts && opts.live) {
    state.call = call;
    state.callSeat = session.active;
    state.callAnchor = opts.anchor;
    state.readout = r;
    state.response = [];
    renderAll();
  }
  renderPrep();
  return prepared;
}

function requestSpeculation() {
  const seat = 1 - session.active;
  const engine = session.seats[seat];
  if (engine === "human") return;
  clearTimeout(prepTimer);
  prepTimer = setTimeout(() => {
    const { anchor, notes } = quantizeTurn();
    if (!notes.length) { prepared = null; renderPrep(); return; }
    const sig = signature(notes);
    if (sig === lastSpecSig) return;                       // nothing changed
    if (engine === "jev" && specCount >= GUARD.maxSpeculationsPerTurn) return;
    lastSpecSig = sig;
    specCount++;
    void prepareAnswer(seat, notes, { live: true, anchor });
  }, SPEC_DELAY[engine] || 35);
}

// ---------------------------------------------------------------------------
// Scheduling and turn taking
// ---------------------------------------------------------------------------

const SILENCE_BEATS = 0.5;
const TRADE_BEATS = 8;
const LOOKAHEAD_S = 0.18;
const LEAD_S = 0.09;

let entry = null;
let machineBusy = false;
let turnAnchor = null;

function scheduleMachinePhrase(r, idx) {
  const notes = r.cands[idx];
  const at = Math.ceil(beatNow() + LEAD_S * transport.bpm / 60);
  entry = { beat: at, notes, done: new Set(), endBeat: at + phraseLen(notes) };

  state.call = session.last;
  state.callAnchor = session.lastAnchor;
  state.callSeat = 1 - session.active;
  state.response = notes;
  state.respSeat = session.active;
  state.respStart = at - session.lastAnchor;
  state.readout = Object.assign({}, r, { idx });
  state.phase = "playing";
  prepared = null;
  renderAll();
  renderPrep();
  setStatus(seatLabel(session.active) + " — " + STRATEGIES[r.strat.pick], "resp");

  // build the reply to this phrase while it is still sounding
  const next = 1 - session.active;
  if (session.seats[next] !== "human") void prepareAnswer(next, notes, null);
}

/** Play a phrase nobody had to decide on, to open an automatic session. */
function scheduleSeed(notes) {
  const at = Math.ceil(beatNow() + LEAD_S * transport.bpm / 60);
  entry = { beat: at, notes, done: new Set(), endBeat: at + phraseLen(notes) };
  session.lastAnchor = at;
  state.call = [];
  state.callAnchor = at;
  state.callSeat = 1 - session.active;
  state.response = notes;
  state.respSeat = session.active;
  state.respStart = 0;
  state.readout = null;
  state.phase = "playing";
  renderAll();
  setStatus(seatLabel(session.active) + " — 種フレーズ", "resp");
  const next = 1 - session.active;
  if (session.seats[next] !== "human") void prepareAnswer(next, notes, null);
}

function abortTurn(reason) {
  entry = null;
  if (session.auto) { stopAuto(reason); return; }
  state.phase = "idle";
  showBanner(reason);
  setStatus("どうぞ、続けてください", null);
}

async function startMachineTurn() {
  if (machineBusy || entry) return;
  machineBusy = true;
  try {
    if (session.auto) {
      const stop = guardBeforeTurn(session, engineCalls, document.hidden);
      if (stop) { stopAuto(stop); return; }
    }

    let r = prepared;
    if (!r || r.forSeat !== session.active || signature(r.call) !== signature(session.last)) {
      r = await prepareAnswer(session.active, session.last, null);
    }
    if (!r || !r.cands || !r.cands.length) { abortTurn("応答を作れませんでした"); return; }
    if (!session.auto && !entry && state.phase !== "playing" && held.size) return;  // they played again

    const pick = resolvePhrase(r, session.history);
    let idx = pick.idx >= 0 ? pick.idx : r.idx;
    if (pick.cycled && session.auto) {
      session.breaks++;
      if (session.breaks >= GUARD.maxCycleBreaks) { stopAuto("同じフレーズに戻り続けています"); return; }
      if (pick.idx < 0) { stopAuto("どの候補も直近のフレーズの繰り返しです"); return; }
      showBanner("循環を検出 — 別の候補に差し替えました（" + session.breaks + "/" + GUARD.maxCycleBreaks + "）");
    }
    if (!r.cands[idx] || !r.cands[idx].length) { abortTurn("フレーズが空になりました"); return; }

    scheduleMachinePhrase(r, idx);
  } finally {
    machineBusy = false;
  }
}

function beginHumanTurn() {
  state.phase = "listening";
  events = [];
  turnAnchor = null;
  specCount = 0;
  lastSpecSig = "";
  prepared = null;
  renderPrep();
  setStatus("どうぞ、続けてください", null);
}

/** One seat has finished. Record the phrase, flip seats, and start the next. */
function handOff(phrase, anchor) {
  session.last = phrase;
  session.lastAnchor = anchor;
  session.history.push(signature(phrase));
  if (session.history.length > 32) session.history.shift();
  session.turns++;
  entry = null;
  session.active = 1 - session.active;
  updateMeters();

  if (session.seats[session.active] === "human") beginHumanTurn();
  else void startMachineTurn();
}

function endHumanTurn() {
  const { anchor, notes } = quantizeTurn();
  if (!notes.length) return;
  events = [];
  handOff(notes, anchor);
}

function pumpNotes(beat) {
  const horizon = beat + LOOKAHEAD_S * transport.bpm / 60;
  const beatSec = 60 / transport.bpm;
  entry.notes.forEach((n, i) => {
    if (entry.done.has(i)) return;
    const abs = entry.beat + n.beat;
    if (abs > horizon) return;
    entry.done.add(i);
    const when = Math.max(ctx.currentTime + 0.004, beatToTime(abs));
    playNote(degToMidi(n.degree), when, Math.max(0.14, n.dur * beatSec * 0.9), seatClass(state.respSeat) === "you" ? "you" : "bot");
  });
  if (beat > entry.endBeat + 0.25) {
    const played = entry.notes;
    const at = entry.beat;
    if (session.auto || session.seats.includes("human")) handOff(played, at);
    else { entry = null; state.phase = "idle"; }
  }
}

function pumpClicks(beat) {
  if (!state.metro) { nextClick = Math.ceil(beat); return; }
  if (nextClick < beat) nextClick = Math.ceil(beat);
  const horizon = beat + LOOKAHEAD_S * transport.bpm / 60;
  while (nextClick <= horizon) {
    playClick(beatToTime(nextClick), mod(Math.round(nextClick), 4) === 0);
    nextClick += 1;
  }
}

function tick() {
  if (!transport || !ctx) return;
  const beat = beatNow();

  if (state.phase === "listening" && (events.length || held.size)) {
    const quiet = held.size === 0 && (beat - lastActivity) >= SILENCE_BEATS;
    const atLine = turnAnchor !== null && (beat - turnAnchor) >= TRADE_BEATS;
    if (quiet || atLine) endHumanTurn();
  }

  if (entry) pumpNotes(beat);
  pumpClicks(beat);
}

function frame() {
  const ph = $("#playhead");
  const live = transport && ctx && state.callAnchor !== null &&
               (state.phase === "listening" || entry);
  if (live) {
    const rel = beatNow() - state.callAnchor;
    if (rel >= 0 && rel <= state.totalBeats) {
      ph.hidden = false;
      ph.style.left = pct(rel * 100 / state.totalBeats);
    } else {
      ph.hidden = true;
    }
  } else {
    ph.hidden = true;
  }
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------------------
// Automatic sessions — two engines trading, with an end that always arrives
// ---------------------------------------------------------------------------

/** An opening motif, so the first engine has something to answer. */
function seedPhrase() {
  const steps = [1, 2, -1, 2, -2, 3];
  const n = 3 + Math.floor(Math.random() * 3);
  const out = [];
  let beat = 0, degree = 0;
  for (let i = 0; i < n; i++) {
    const dur = [0.5, 0.5, 1][Math.floor(Math.random() * 3)];
    out.push({ degree: clampDeg(degree), beat, dur });
    beat += dur;
    degree = clampDeg(degree + steps[Math.floor(Math.random() * steps.length)]);
  }
  return out;
}

function startAuto() {
  if (session.seats.includes("human")) return;
  if (!audio()) return;
  if (!transport) startTransport();

  session.auto = true;
  session.turns = 0;
  session.breaks = 0;
  session.errors = 0;
  session.history = [];
  session.active = 0;
  engineCalls = 0;
  prepared = null;
  clearBanner();
  updateMeters();
  $("#auto").textContent = "停止";
  $("#auto").classList.add("btn-accent");
  scheduleSeed(seedPhrase());
}

function stopAuto(reason) {
  const wasAuto = session.auto;
  session.auto = false;
  entry = null;
  machineBusy = false;
  state.phase = "idle";
  $("#auto").textContent = "自動セッション開始";
  $("#auto").classList.remove("btn-accent");
  if (reason && wasAuto) showBanner("停止: " + reason, true);
  setStatus(reason ? "停止しました" : "待機中", null);
  renderPrep();
}

// ---------------------------------------------------------------------------
// Input
// ---------------------------------------------------------------------------

function padFor(d) { return document.querySelector('.pad[data-deg="' + d + '"]'); }

/** Clear the board and take the human seat's turn, from wherever we were. */
function takeTheFloor() {
  const seat = session.seats.indexOf("human");
  if (seat < 0) return false;
  if (session.auto) stopAuto("演奏で割り込みました");
  entry = null;
  machineBusy = false;
  prepared = null;
  events = [];
  session.active = seat;
  turnAnchor = null;
  specCount = 0;
  lastSpecSig = "";
  state.call = [];
  state.response = [];
  state.readout = null;
  state.callAnchor = null;
  state.callSeat = seat;
  state.respSeat = 1 - seat;
  state.isExample = false;
  state.phase = "listening";
  renderAll();
  renderPrep();
  return true;
}

function noteOn(degree) {
  const d = clampDeg(degree);
  if (held.has(d)) return;
  if (session.seats.indexOf("human") < 0) {
    showBanner("どちらかの席を「あなた」にすると弾けます");
    return;
  }
  if (!audio()) return;
  if (!transport) startTransport();
  if (state.phase !== "listening" || state.isExample) {
    if (!takeTheFloor()) return;
  }

  const beat = beatNow();
  if (turnAnchor === null) turnAnchor = snap(beat);
  lastActivity = beat;
  held.set(d, { beatOn: beat, voice: startVoice(degToMidi(d), "you") });
  const pad = padFor(d);
  if (pad) pad.classList.add("on");
  setStatus("聞いています…", "live");
  requestSpeculation();
}

function noteOff(degree) {
  const d = clampDeg(degree);
  const h = held.get(d);
  if (!h) return;
  held.delete(d);
  h.voice.stop();

  const beat = beatNow();
  lastActivity = beat;
  events.push({ degree: d, beatOn: h.beatOn, beatOff: Math.max(beat, h.beatOn + GRID / 2) });
  const pad = padFor(d);
  if (pad) pad.classList.remove("on");
  requestSpeculation();
}

function reset() {
  clearTimeout(prepTimer);
  prepGen++;
  if (specAbort) specAbort.abort();
  for (const [d, h] of held) { h.voice.stop(); const p = padFor(d); if (p) p.classList.remove("on"); }
  held.clear();
  stopAuto(null);
  clearBanner();
  transport = null;
  lastActivity = 0;
  events = [];
  turnAnchor = null;
  specCount = 0;
  lastSpecSig = "";
  prepared = null;
  engineCalls = 0;
  session.turns = 0;
  session.breaks = 0;
  session.errors = 0;
  session.history = [];
  session.last = [];
  session.active = Math.max(0, session.seats.indexOf("human"));
  state.call = [];
  state.response = [];
  state.readout = null;
  state.callAnchor = null;
  state.isExample = false;
  state.phase = "idle";
  updateMeters();
  renderAll();
  renderPrep();
  setStatus(session.seats.includes("human")
    ? "パッドを押すか A〜L キーで弾いてください"
    : "「自動セッション開始」を押してください", null);
}

function buildPads() {
  const wrap = $("#pads");
  wrap.innerHTML = "";
  KEYS.forEach((key, i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "pad";
    btn.dataset.deg = String(i);
    btn.setAttribute("aria-label", "音階 " + (i + 1));
    btn.innerHTML = "<b>" + (i + 1) + "</b><span>" + key.toUpperCase() + "</span>";
    btn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      btn.setPointerCapture(e.pointerId);
      noteOn(i);
    });
    const up = () => noteOff(i);
    btn.addEventListener("pointerup", up);
    btn.addEventListener("pointercancel", up);
    wrap.appendChild(btn);
  });
}

function buildSelects() {
  const t = $("#tonic");
  TONICS.forEach((n) => {
    const o = document.createElement("option");
    o.value = n; o.textContent = n;
    t.appendChild(o);
  });
  t.value = state.tonic;

  const s = $("#scale");
  Object.entries(SCALES).forEach(([k, v]) => {
    const o = document.createElement("option");
    o.value = k; o.textContent = v.label;
    s.appendChild(o);
  });
  s.value = state.scale;

  [0, 1].forEach((i) => {
    const sel = $("#seat" + i);
    Object.entries(SEATS).forEach(([k, label]) => {
      const o = document.createElement("option");
      o.value = k; o.textContent = label;
      sel.appendChild(o);
    });
    sel.value = session.seats[i];
    sel.addEventListener("change", () => setSeat(i, sel.value));
  });
}

/** Only one seat may be a person; the app has one keyboard. */
function setSeat(i, value) {
  session.seats[i] = value;
  const other = 1 - i;
  if (value === "human" && session.seats[other] === "human") {
    session.seats[other] = "local";
    $("#seat" + other).value = "local";
  }
  reset();
  syncAutoButton();
}

function syncAutoButton() {
  const btn = $("#auto");
  const canAuto = !session.seats.includes("human");
  btn.disabled = !canAuto;
  btn.title = canAuto ? "" : "両方の席をエンジンにすると自動セッションを開始できます";
}

function midiToDegree(note) {
  let best = 0, dist = Infinity;
  for (let d = DEG_MIN; d <= DEG_MAX; d++) {
    const gap = Math.abs(degToMidi(d) - note);
    if (gap < dist) { dist = gap; best = d; }
  }
  return best;
}

async function initMidi() {
  if (!navigator.requestMIDIAccess) return;
  try {
    const access = await navigator.requestMIDIAccess();
    const handle = (ev) => {
      const [status, note, vel] = ev.data;
      const cmd = status & 0xf0;
      if (cmd === 0x90 && vel > 0) noteOn(midiToDegree(note));
      else if (cmd === 0x80 || (cmd === 0x90 && vel === 0)) noteOff(midiToDegree(note));
    };
    const wire = () => {
      let n = 0;
      for (const input of access.inputs.values()) { input.onmidimessage = handle; n++; }
      $("#midi-status").innerHTML = n ? '<span class="midi-tag">MIDI 入力 ' + n + '台</span>' : "";
    };
    wire();
    access.onstatechange = wire;
  } catch (err) {
    /* Web MIDI unavailable or blocked — pads and keyboard still work. */
  }
}

function initEvents() {
  document.addEventListener("keydown", (e) => {
    if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
    const tag = e.target && e.target.tagName;
    if (tag === "SELECT" || tag === "INPUT" || tag === "BUTTON") return;
    const i = KEYS.indexOf(e.key.toLowerCase());
    if (i >= 0) { e.preventDefault(); noteOn(i); }
  });
  document.addEventListener("keyup", (e) => {
    const i = KEYS.indexOf(e.key.toLowerCase());
    if (i >= 0) noteOff(i);
  });

  $("#tonic").addEventListener("change", (e) => { state.tonic = e.target.value; renderAll(); });
  $("#scale").addEventListener("change", (e) => { state.scale = e.target.value; renderAll(); });
  $("#bpm").addEventListener("input", (e) => {
    setBpm(Number(e.target.value));
    $("#bpm-val").textContent = String(state.bpm);
  });
  $("#metro").addEventListener("change", (e) => { state.metro = e.target.checked; });
  $("#clear").addEventListener("click", reset);
  $("#auto").addEventListener("click", () => {
    if (session.auto) stopAuto("手動で停止しました");
    else startAuto();
  });
  $("#replay").addEventListener("click", () => {
    if (!state.response.length || !audio()) return;
    if (session.auto) return;
    if (!transport) startTransport();
    const at = Math.ceil(beatNow() + LEAD_S * transport.bpm / 60);
    entry = {
      beat: at,
      notes: state.response,
      done: new Set(),
      endBeat: at + phraseLen(state.response),
    };
    state.callAnchor = at - state.respStart;
    state.phase = "playing";
    setStatus("再生中", "resp");
  });

  // an automatic session must not keep spending calls on a tab nobody is watching
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && session.auto) stopAuto("タブが非表示になったため停止しました");
  });
}

// ---------------------------------------------------------------------------
// Boot — open on a worked example so the page shows what it does at rest
// ---------------------------------------------------------------------------

function loadExample() {
  const call = [
    { degree: 0, beat: 0,   dur: 0.5 },
    { degree: 2, beat: 0.5, dur: 0.5 },
    { degree: 4, beat: 1,   dur: 0.5 },
    { degree: 2, beat: 1.5, dur: 0.5 },
    { degree: 4, beat: 2,   dur: 1 },
  ];
  const r = Object.assign(respond(call), { source: "local" });
  state.call = call;
  state.callSeat = 0;
  state.respSeat = 1;
  state.callAnchor = 0;
  state.readout = r;
  state.respStart = Math.max(4, Math.ceil((phraseLen(call) + 0.5) / 4) * 4);
  state.response = r.response;
  state.isExample = true;
}

buildSelects();
buildPads();
initEvents();
syncAutoButton();
updateMeters();
loadExample();
renderAll();
renderPrep();
setStatus("例を表示中 — 弾くと差し替わります", null);
setInterval(tick, 25);
requestAnimationFrame(frame);
initMidi();

})();

</script>
</body>
</html>
